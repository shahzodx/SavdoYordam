name: savdoyordam
description: SavdoYordam — daily retail operations for small shops.
publish_to: none
version: 0.2.0+2
environment:
  sdk: '>=3.13.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.3
  dio: ^5.11.1
  drift: ^2.35.3
  flutter_secure_storage: ^10.0.0
  path_provider: ^2.1.5
  uuid: ^4.5.1
  intl: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans.ttf
  assets:
    - lib/l10n/
