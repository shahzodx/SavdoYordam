services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: savdoyordam
      POSTGRES_USER: savdoyordam
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U savdoyordam -d savdoyordam']
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  migrate:
    build: services/api
    command: [./api, migrate]
    environment:
      DATABASE_URL: postgres://savdoyordam:${POSTGRES_PASSWORD}@db:5432/savdoyordam?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
  api:
    build: services/api
    ports: ['127.0.0.1:8080:8080']
    environment:
      DATABASE_URL: postgres://savdoyordam:${POSTGRES_PASSWORD}@db:5432/savdoyordam?sslmode=disable
      LISTEN_ADDR: 0.0.0.0:8080
      APP_ENV: ${APP_ENV:-local}
      SENTRY_DSN: ${SENTRY_DSN:-}
      FCM_ENABLED: ${FCM_ENABLED:-false}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8080/health/ready']
      interval: 15s
      timeout: 3s
      retries: 3
volumes:
  postgres_data:
